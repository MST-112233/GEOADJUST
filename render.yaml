# render.yaml
services:
  - type: web
    name: geoadjust-tracking
    runtime: python
    plan: free
    region: singapore  # Choose: ohio, virginia, frankfurt, singapore, oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 updated_app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
    healthCheckPath: /api/health
    autoDeploy: true
