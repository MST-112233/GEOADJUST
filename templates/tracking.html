<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GEOADJUST - Real-Time Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- SocketIO & Leaflet JS -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; flex-direction: column; }
        #auth-screen { padding: 30px; max-width: 400px; margin: auto; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #main-app { display: none; flex: 1; flex-direction: row; height: 100vh; }
        #map { flex: 2; height: 100%; }
        #sidebar { flex: 1; display: flex; flex-direction: column; border-left: 2px solid #ddd; background: #f9f9f9; padding: 15px; }
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #ccc; background: #fff; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .msg { margin-bottom: 8px; font-size: 14px; }
        .msg strong { color: #333; }
        .msg span { font-size: 11px; color: #888; margin-left: 5px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input, select, button { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 5px; }
        button:hover { background: #0056b3; }
        .btn-download { background: #28a745; margin-top: 5px; }
        .btn-download:hover { background: #218838; }
        #download-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid #ccc; }
    </style>
</head>
<body>

    <!-- Room Entry Form -->
    <div id="auth-screen">
        <h2>GEOADJUST Real-Time Room</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
            <label>Room ID</label>
            <input type="text" id="room-id" placeholder="Enter Room ID" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter Room Password" required>
        </div>
        <div class="form-group">
            <label>Role</label>
            <select id="role">
                <option value="Control Center">Control Center (Office)</option>
                <option value="Site Surveyor">Site Surveyor (Field Worker)</option>
            </select>
        </div>
        <button onclick="joinRoom()">Enter Room</button>
    </div>

    <!-- Main Live Interface -->
    <div id="main-app">
        <div id="map"></div>
        <div id="sidebar">
            <h3 id="room-header">Room: </h3>
            <p id="role-header" style="font-size: 13px; color: #555; margin-bottom: 10px;"></p>

            <div id="chat-box"></div>

            <div class="form-group" style="display:flex; gap:5px;">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button onclick="sendMessage()" style="width: auto;">Send</button>
            </div>

            <!-- Control Center Export Tools -->
            <div id="download-section" style="display: none;">
                <h4>Control Center Export Options</h4>
                <form id="dl-loc-form" action="/download/locations/" method="POST" style="margin-bottom: 5px;">
                    <input type="hidden" name="password" class="pass-field">
                    <input type="hidden" name="role" class="role-field">
                    <button type="submit" class="btn-download">Download Location Logs (CSV)</button>
                </form>
                <form id="dl-chat-form" action="/download/chat/" method="POST">
                    <input type="hidden" name="password" class="pass-field">
                    <input type="hidden" name="role" class="role-field">
                    <button type="submit" class="btn-download">Download Chat Logs (TXT)</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let socket = io();
        let map, currentRoom, currentRole, currentPassword, currentUsername;
        let surveyorMarkers = {};
        let locationTimer = null;

        function joinRoom() {
            currentUsername = document.getElementById('username').value.trim();
            currentRoom = document.getElementById('room-id').value.trim();
            currentPassword = document.getElementById('password').value.trim();
            currentRole = document.getElementById('role').value;

            if(!currentUsername || !currentRoom || !currentPassword) {
                alert("Please complete all entry fields.");
                return;
            }

            socket.emit('join_room_event', {
                username: currentUsername,
                room_id: currentRoom,
                password: currentPassword,
                role: currentRole
            });
        }

        socket.on('error_response', function(data) {
            alert(data.message);
        });

        socket.on('join_success', function(data) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';

            document.getElementById('room-header').innerText = `Room: ${data.room_id}`;
            document.getElementById('role-header').innerText = `Role: ${data.role} | User: ${currentUsername}`;

            // Initialize Map
            map = L.map('map').setView([3.1390, 101.6869], 12); // Default center
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Populate existing chat logs
            data.chat_history.forEach(appendMessage);

            // Populate active surveyor locations
            data.locations_history.forEach(updateMapMarker);

            // Configure exports for Control Center
            if (currentRole === 'Control Center') {
                document.getElementById('download-section').style.display = 'block';
                document.getElementById('dl-loc-form').action = `/download/locations/${data.room_id}`;
                document.getElementById('dl-chat-form').action = `/download/chat/${data.room_id}`;
                
                document.querySelectorAll('.pass-field').forEach(el => el.value = currentPassword);
                document.querySelectorAll('.role-field').forEach(el => el.value = currentRole);
            }

            // Start 10-second Location Update Loop for Site Surveyors
            if (currentRole === 'Site Surveyor') {
                sendLocation();
                locationTimer = setInterval(sendLocation, 10000); // 10-second updates
            }
        });

        function sendLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    socket.emit('update_location', {
                        room_id: currentRoom,
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    });
                }, err => {
                    console.error("GPS Error:", err);
                }, { enableHighAccuracy: true });
            }
        }

        socket.on('location_broadcast', function(data) {
            updateMapMarker(data);
        });

        function updateMapMarker(data) {
            const { sid, username, lat, lng, timestamp } = data;
            
            if (surveyorMarkers[sid]) {
                surveyorMarkers[sid].setLatLng([lat, lng]);
                surveyorMarkers[sid].getPopup().setContent(`<b>${username}</b><br>Updated: ${timestamp}`);
            } else {
                let marker = L.marker([lat, lng]).addTo(map)
                    .bindPopup(`<b>${username}</b><br>Updated: ${timestamp}`);
                surveyorMarkers[sid] = marker;
            }
        }

        socket.on('user_disconnected', function(data) {
            if (surveyorMarkers[data.sid]) {
                map.removeLayer(surveyorMarkers[data.sid]);
                delete surveyorMarkers[data.sid];
            }
        });

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (msg) {
                socket.emit('send_message', { room_id: currentRoom, message: msg });
                input.value = '';
            }
        }

        socket.on('receive_message', function(data) {
            appendMessage(data);
        });

        function appendMessage(data) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<strong>${data.sender}</strong> (${data.role}) <span>${data.timestamp}</span>: <br>${data.message}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
